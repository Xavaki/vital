<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <title>Vital</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="p-head">
    <div class="eyebrow">
      <span id="readout-label">Time left today</span>
      <span>resets 00:00</span>
    </div>
    <div id="readout" class="readout">–:––</div>
    <div id="used" class="used"></div>
    <div id="meter" class="meter" role="img"></div>
    <div id="live" class="live" hidden>
      <span class="dot" aria-hidden="true"></span>
      <span><span id="live-state">Counting</span> · <span id="live-host"></span></span>
    </div>
  </header>

  <section class="history" aria-labelledby="history-h">
    <h2 id="history-h" class="eyebrow">
      <span>Last 7 days</span>
      <span id="week-avg"></span>
    </h2>
    <div id="chart" class="chart"></div>
    <!-- Same numbers as the chart, for screen readers. -->
    <table id="chart-table" class="sr-only">
      <caption>Time on watchlisted sites per day, last 7 days</caption>
      <thead><tr><th scope="col">Day</th><th scope="col">Time</th><th scope="col">Over allowance</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="visits" aria-labelledby="visits-h">
    <h2 id="visits-h" class="eyebrow">Recent visits</h2>
    <ul id="visit-list" class="visit-list"></ul>
    <p id="visit-empty" class="empty" hidden>No visits yet.</p>
  </section>

  <footer class="p-foot">
    <button id="manage" type="button" class="link">Settings</button>
  </footer>

  <script src="../shared/config.js"></script>
  <script src="../shared/usage.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
